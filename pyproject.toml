[project]
name = "wpbuddy"
version = "0.2.0"
description = "Open-source WordPress vulnerability scanner: passive & active scanning plus local plugin/theme code auditing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "markdownmaker>=0.4",
]

[project.optional-dependencies]
# --covert: impersonates a real browser's TLS fingerprint and HTTP/2
covert = ["curl-cffi>=0.7"]

[project.scripts]
wpbuddy = "wpbuddy.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wpbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
